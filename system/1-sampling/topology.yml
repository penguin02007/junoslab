message: |
  This lab consists two devices and a Linux server for sampling.

provider: clab
defaults.device: vjunos-router
nodes:
  srv1:
    clab:
      env:
        CLAB_MGMT_PASSTHROUGH: "true"
  vpe2:
    clab:
      env:
        CLAB_MGMT_PASSTHROUGH: "true"
  vpe1:
    clab:
      env:
        CLAB_MGMT_PASSTHROUGH: "true"
groups:
  srv:
    members: [ srv1 ]
    device: linux
    clab:
      exec:
        - bash -c "apt-get update && apt-get install iproute2 net-tools vim pmacct -y"
#        - bash -c "apt-get update && apt-get install iproute2 net-tools vim pmacct -y && echo 'nfacctd_port: 2055' >> /etc/pmacct/nfacctd.conf && echo 'nfacctd_ip: 0.0.0.0' >> /etc/pmacct/nfacctd.conf && facct -f /etc/pmacct/nfacctd.conf"
  pe:
    members: [ vpe1, vpe2 ]
links:
  - vpe1:
    vpe2:
  - vpe1-srv1
  - vpe2-srv1
addressing:
  p2p:
    ipv4: 172.20.0.0/24
    ipv6: 2001:db8:1000::/48
    prefix: 30
  loopback:
    ipv4: 172.16.0.0/24
