services {
    flow-monitoring {
        version-ipfix {
            template jncie_tmpl {
                flow-active-timeout 30;
                flow-inactive-timeout 180;
                ipv6-template;
            }
        }
    }
}
interfaces {
    ge-0/0/0 {
        mtu 1514;
        unit 0 {
            description "vpe1 -> vpe2";
            family inet {
                sampling {
                    input;
                    output;
                }
                address 172.20.0.0/31;
            }
            family inet6 {
                sampling {
                    input;
                    output;
                }
                address 2001:db8:1000::1/64;
            }
        }
    }
    ge-0/0/1 {
        mtu 1514;
        unit 0 {
            description "vpe1 -> srv1 [stub]";
            family inet {
                address 172.16.0.4/24;
            }
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 192.168.2.104/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 172.16.16.1/32;
            }
        }
    }
}
forwarding-options {
    sampling {
        family inet {
            input {
                rate 50;
            }
            output {
                flow-server 192.168.2.101 {
                    port 2055;
                    source-address 172.16.16.1;
                    version 5;
                }
            }
        }
        instance {
            jncie {
                family inet6 {
                    input {
                        rate 1000;
                    }
                    output {
                        flow-server 192.168.2.101 {
                            port 2055;
                            source-address 172.16.16.1;
                            version-ipfix {
                                template {
                                    jncie_tmpl;
                                }
                            }
                        }
                        inline-jflow {
                            source-address 172.16.16.1;
                        }
                    }
                }
            }
        }
    }
}
routing-instances {
    mgmt_junos {
        routing-options {
            static {
                route 0.0.0.0/0 next-hop 192.168.2.1;
            }
        }
    }
}
protocols {
    router-advertisement {
        interface ge-0/0/0.0;
    }
    lldp {
        interface fxp0 {
            disable;
        }
        interface all;
    }
}
