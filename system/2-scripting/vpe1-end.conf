## Junos Lab ##
version 23.4R2-S2.1;
system {
    host-name vpe1;
    root-authentication {
        encrypted-password "$6$NNUAn6mI$3PJiB4B.xspcOEiop7ejgyokolNykKIakNErA7Zggmot/KVvKeJkv9/frrggChjrxdefn6gT83i/PF1lrLv2n0";
    }
    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$anZRsv.T$l5NqmBug6xbvL3X/kv/UBz2v/lmTmnKTIbl4faYhijhBIp/Nc/mH/yyrMB8u.hrYLRmINlaTDiLyet76m7Lm40";
            }
        }
    }
    services {
        netconf {
            ssh;
        }
        ssh {
            root-login allow;
        }
        extension-service {
            request-response {
                grpc {
                    ssl {
                        port 43123;
                        local-certificate jncie_cert;
                        use-pki;
                    }
                    max-connections 15;
                }
            }
            notification {
                allow-clients {
                    address 10.10.1.1/32;
                }
            }
        }
    }
    management-instance;
    static-host-mapping {
        srv1 inet 172.16.0.1;
        vpe2 inet 10.0.0.2;
    }
    syslog {
        host 192.168.99.101 {
            any notice;
        }
    }
    ntp {
        server 192.168.99.101 routing-instance mgmt_junos;
    }
}
chassis {
    fpc 0 {
        pic 0 {
            number-of-ports 12;
        }
        sampling-instance jncie;
        inline-services {
            flow-table-size {
                ipv6-flow-table-size 120;
            }
        }
    }
}
services {
    flow-monitoring {
        version-ipfix {
            template jncie_ipfix {
                flow-active-timeout 30;
                flow-inactive-timeout 180;
                ipv6-template;
            }
        }
    }
}
interfaces {
    ge-0/0/0 {
        mtu 1514;
        unit 0 {
            description "vpe1 -> vpe2";
            family inet {
                sampling {
                    input;
                    output;
                }
                address 172.20.0.1/30;
            }
            family inet6 {
                sampling {
                    input;
                    output;
                }
                address 2001:db8:1000::1/64;
            }
        }
    }
    ge-0/0/1 {
        mtu 1514;
        unit 0 {
            description "vpe1 -> srv1 [stub]";
            family inet {
                address 172.16.0.3/24;
            }
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 192.168.99.103/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.0.0.3/32;
            }
        }
    }
}
snmp {
    name vpe1;
    filter-duplicates;
    v3 {
        usm {
            local-engine {
                user snmpv3 {
                    authentication-sha512 {
                        authentication-key "$9$YV2GDHkPn9A5T/tO1hcYg4aJDkqf3/Cs2JDiHmPQFn6p0RhSeK81IYgaZkqtu0BSrLxN-bsvMxdbwg4TzFn6Ap0BREyqmF/9A0Odbw2gJUjHqfTDjBIRhrlYg4ZGimPQ/9pzFKM8Xbw.PfzF/0ORrlMhcbsgoji0B1hevLX-Vb2x7b2oJHkuOBREyrevWX7CtKMWLVbgoJDjqFn/0ORtpvWxNbwz3n9A0BIEclK1I7-Vs4oJGDj.P69At0BDi.5FnCAWLX7Nb24aZjHsYTzFnCAvW8Xbs4oGkmfX7P5QzCA7-dwoJGUHPfzjip0IRleoJZDjqfTz9CuJGtuB1hc4aJGHqTQn9tu5T1REcleUjiqmTn6A";
                    }
                }
            }
        }
        vacm {
            security-to-group {
                security-model usm {
                    security-name snmpv3 {
                        group snmpv3grp;
                    }
                }
            }
            access {
                group snmpv3grp {
                    default-context-prefix {
                        security-model usm {
                            security-level authentication {
                                read-view readonly_view;
                            }
                        }
                    }
                }
            }
        }
    }
    view readonly_view {
        oid .1;
    }
}
forwarding-options {
    sampling {
        family inet {
            input {
                rate 50;
            }
            output {
                flow-server 192.168.99.101 {
                    port 2055;
                    source-address 10.0.0.3;
                    version 5;
                }
            }
        }
        instance {
            jncie {
                family inet6 {
                    input {
                        rate 1000;
                    }
                    output {
                        flow-server 192.168.99.101 {
                            port 2055;
                            source-address 10.0.0.3;
                            version-ipfix {
                                template {
                                    jncie_ipfix;
                                }
                            }
                        }
                        inline-jflow {
                            source-address 10.0.0.3;
                        }
                    }
                }
            }
        }
    }
}
event-options {
    generate-event {
        every_1m time-interval 60;
    }
    policy log_core_file_warning {
        events every_1m;
        then {
            event-script log-core-file-warning.slax;
        }
    }
    event-script {
        traceoptions {
            file event.log;
            flag all;
        }
        file log-core-file-warning.slax;
    }
}
routing-instances {
    mgmt_junos {
        routing-options {
            static {
                route 0.0.0.0/0 next-hop 192.168.99.1;
            }
        }
    }
}
protocols {
    router-advertisement {
        interface ge-0/0/0.0;
    }
    lldp {
        interface fxp0 {
            disable;
        }
        interface all;
    }
}
