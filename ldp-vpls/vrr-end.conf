## Junos Lab ##
version 23.4R2-S2.1;
system {
    host-name clab-ml-23-vrr;
    root-authentication {
        encrypted-password "$6$lKu.LsDm$AnDnwo2zpgS67p0slNrWajiriV2AQGihzTpYS1TgnwHWB6WCv9.Is.6QQvCzaldlIy./uKHwSoeMe9M4R/3sc.";
    }
    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$7MsFOZYn$dB1H8T8BcmJnzmFkbVqBhxt9tNUD9NyGvRGKmWOPRC4GKepCbjIpghs1QieeVLe.IS9Axoy.Yk39aefyNSBq1/";
            }
        }
    }
    services {
        netconf {
            ssh;
        }
        ssh {
            root-login allow;
        }
    }
    management-instance;
    static-host-mapping {
        vr1 inet 172.16.0.1;
        vr2 inet 172.16.0.2;
        vr7 inet 172.16.0.7;
        vr8 inet 172.16.0.8;
        vce2-1 inet 172.16.0.121;
        vce2-2 inet 172.16.0.122;
        vce2-5 inet 172.16.0.125;
        vce3-1 inet 172.16.0.131;
    }
}
chassis {
    fpc 0 {
        pic 0 {
            number-of-ports 12;
        }
    }
}
security {
    authentication-key-chains {
        key-chain JNCIE {
            key 0 {
                secret "$9$JDUi.AtOREyQFCuOBEhVws4GD";
                start-time "2026-6-14.06:06:00 +0000";
                algorithm ao;
                ao-attribute {
                    send-id 1;
                    recv-id 1;
                    tcp-ao-option enabled;
                    cryptographic-algorithm aes-128-cmac-96;
                }
            }
        }
    }
}
interfaces {
    ge-0/0/8 {
        flexible-vlan-tagging;
        unit 0 {
            description vR10->vR1;
            vlan-id 4093;
        }
        unit 206 {
            description "vr10 -> vr1";
            vlan-id 206;
            family inet {
                address 172.20.0.65/31;
            }
            family iso;
        }
    }
    ge-0/0/9 {
        flexible-vlan-tagging;
        unit 0 {
            description vR10->vR2;
            vlan-id 4093;
        }
        unit 207 {
            description "vr10 -> vr2";
            vlan-id 207;
            family inet {
                address 172.20.0.67/31;
            }
            family iso;
        }
    }
    protect: fxp0 {
        unit 0 {
            family inet {
                address 192.168.23.110/24;
            }
            family inet6 {
                address fd00:df:1ab:23::a/64;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 172.16.0.10/32;
            }
            family iso {
                address 49.0001.0000.0000.0010.00;
            }
            family inet6 {
                address fd00:172:16::172:16:1:0/128;
            }
        }
    }
}
routing-instances {
    protect: mgmt_junos {
        routing-options {
            rib mgmt_junos.inet6.0 {
                static {
                    route ::/0 next-hop fd00:df:1ab:23::1;
                }
            }
            static {
                route 0.0.0.0/0 next-hop 192.168.23.1;
            }
        }
    }
}
routing-options {
    inactive: rib inet.3 {
        static {
            route 172.16.0.0/24 receive;
        }
    }
    rib inet6.3 {
        static {
            route 0:0:0:0:0:ffff::/96 receive;
        }
    }
    resolution {
        rib bgp.l2vpn.0 {
            resolution-ribs inet.0;
        }
    }
    autonomous-system 54000;
}
protocols {
    bgp {
        group cluster-1 {
            type internal;
            local-address 172.16.0.10;
            family inet {
                unicast;
            }
            family inet6 {
                labeled-unicast {
                    explicit-null;
                }
            }
            family l2vpn {
                signaling;
            }
            cluster 0.0.0.1;
            bfd-liveness-detection {
                minimum-interval 3000;
            }
            neighbor 172.16.0.1;
            neighbor 172.16.0.7;
        }
        group cluster-2 {
            type internal;
            local-address 172.16.0.10;
            family inet {
                unicast;
            }
            family inet6 {
                labeled-unicast {
                    explicit-null;
                }
            }
            family l2vpn {
                signaling;
            }
            cluster 0.0.0.2;
            bfd-liveness-detection {
                minimum-interval 3000;
            }
            neighbor 172.16.0.2;
            neighbor 172.16.0.8;
        }
        disable-4byte-as;
    }
    isis {
        interface all {
            point-to-point;
            family inet {
                bfd-liveness-detection {
                    minimum-interval 2000;
                    multiplier 3;
                }
            }
        }
        level 2 disable;
        level 1 {
            authentication-key "$9$lw6v87ZGi.mTwYJD";
            authentication-type md5;
            wide-metrics-only;
        }
    }
}
