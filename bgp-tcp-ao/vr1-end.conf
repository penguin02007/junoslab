## Junos Lab ##
version 23.2R2.21;
system {
    host-name vr1;
    root-authentication {
        encrypted-password "$6$rXWBymoe$30a5vjBYmJgyBijqzsNpDa69a8G.pYPdGecPZ26xxdluzUO1n96py43AH8Cko/0DMr4AhMtcySzD56.yyERuI0";
    }
    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$ePnVneVz$aRcnkK8w/GIvfqs87q.aIC76t.80tHmfIMe6SqncPFN2zeDqrzq.uhVd1J5CERNdQAKg5mzxgkKRQ8bV/Bbs/1";
            }
        }
    }
    services {
        ssh;
        extension-service {
            request-response {
                grpc {
                    clear-text {
                        port 57400;
                    }
                    max-connections 4;
                }
            }
        }
        netconf {
            ssh;
            rfc-compliant;
        }
    }
    management-instance;
    static-host-mapping {
        vrr inet 172.16.0.10;
        vr2 inet 172.16.0.2;
    }
    syslog {
        file interactive-commands {
            interactive-commands any;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
}
chassis {
    fpc 0 {
        pic 0 {
            number-of-ports 96;
        }
    }
}
security {
    authentication-key-chains {
        key-chain jncie {
            key 0 {
                secret "$9$TF6ArlMXxdBIyK";
                start-time "2026-11-11.21:25:00 +0000";
                algorithm ao;
                ao-attribute {
                    send-id 0;
                    recv-id 0;
                    tcp-ao-option enabled;
                    cryptographic-algorithm aes-128-cmac-96;
                }
            }
        }
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            description vR1->vR2;
            family inet {
                address 172.20.0.0/31;
            }
            family iso;
        }
    }
    ge-0/0/8 {
        flexible-vlan-tagging;
        unit 0 {
            description vR1->vR10;
            vlan-id 4093;
        }
        unit 206 {
            description "vr1 -> vrr";
            vlan-id 206;
            family inet {
                address 172.20.0.64/31;
            }
            family iso;
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 172.16.0.1/32;
            }
            family iso {
                address 49.0001.0000.0000.0001.00;
            }
        }
    }
}
policy-options {
    route-filter-list bgp-default-announce-ipv4 {
        172.16.0.1/32 exact;
    }
    policy-statement bgp-default-redistribute {
        term advertise-ipv4 {
            from {
                route-filter-list bgp-default-announce-ipv4;
            }
            then next policy;
        }
        term redis_bgp {
            from protocol bgp;
            then next policy;
        }
        term default {
            then reject;
        }
    }
    policy-statement bgp-final {
        term final-option {
            then accept;
        }
    }
    policy-statement bgp-initial {
        term initial-cleanup {
            then next policy;
        }
    }
    policy-statement next-hop-all-ipv4 {
        term next-hop-self-ipv4 {
            from family inet;
            then {
                next-hop self;
            }
        }
    }
    policy-statement next-hop-all-ipv6 {
        term next-hop-self-ipv6 {
            from family inet6;
            then {
                next-hop self;
            }
        }
    }
    policy-statement next-hop-ebgp-ipv4 {
        term next-hop-self-ipv4 {
            from {
                family inet;
                route-type external;
            }
            then {
                next-hop self;
            }
        }
    }
    policy-statement next-hop-ebgp-ipv6 {
        term next-hop-self-ipv6 {
            from {
                family inet6;
                route-type external;
            }
            then {
                next-hop self;
            }
        }
    }
}
routing-instances {
    mgmt_junos {
        routing-options {
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
        description management-instance;
    }
}
routing-options {
    router-id 172.16.0.1;
    autonomous-system 65000;
}
protocols {
    bgp {
        group ibgp-peers-ipv4 {
            type internal;
            advertise-inactive;
            export [ next-hop-ebgp-ipv4 bgp-default-redistribute bgp-final ];
            neighbor 172.16.0.10 {
                description vrr;
                local-address 172.16.0.1;
                family inet {
                    unicast;
                }
                authentication-algorithm ao;
                authentication-key-chain jncie;
            }
        }
        group ebgp-peers {
            advertise-inactive;
            export [ bgp-default-redistribute bgp-final ];
        }
    }
    isis {
        interface ge-0/0/0.0 {
            point-to-point;
        }
        interface ge-0/0/8.206 {
            point-to-point;
        }
        interface lo0.0;
        level 1 {
            disable;
            wide-metrics-only;
        }
        level 2 wide-metrics-only;
    }
    lldp {
        interface fxp0 {
            disable;
        }
        interface all;
    }
}
