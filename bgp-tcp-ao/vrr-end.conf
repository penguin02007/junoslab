## Junos Lab ##
version 23.2R2.21;
system {
    host-name vrr;
    root-authentication {
        encrypted-password "$6$QWzMLTOw$eZxJIxYTt16C24W.SEvoSrNN4xhTLccE.rDSN3ogm7rm2JER/QSDLYBXWcduWUXKO4B7AI3qUu3DCX6nsRmdw0";
    }
    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$SUaoE3GR$A2l6HhjhpjMgqS57MISuzx1r/z35hu9TSlXrnhZ3Klot6dfb.5ral5Pf479IQSJGyhKh4JAdwTeE8uEWps3su0";
            }
        }
    }
    services {
        ssh;
        extension-service {
            request-response {
                grpc {
                    clear-text {
                        port 57400;
                    }
                    max-connections 4;
                }
            }
        }
        netconf {
            ssh;
            rfc-compliant;
        }
    }
    management-instance;
    static-host-mapping {
        vr1 inet 172.16.0.1;
        vr2 inet 172.16.0.2;
    }
    syslog {
        file interactive-commands {
            interactive-commands any;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
}
chassis {
    fpc 0 {
        pic 0 {
            number-of-ports 96;
        }
    }
}
security {
    authentication-key-chains {
        key-chain jncie {
            key 0 {
                secret "$9$km5FIRSeK8Ct1h";
                start-time "2026-11-11.21:25:00 +0000";
                algorithm ao;
                ao-attribute {
                    send-id 0;
                    recv-id 0;
                    tcp-ao-option enabled;
                    cryptographic-algorithm aes-128-cmac-96;
                }
            }
        }
    }
}
interfaces {
    ge-0/0/8 {
        flexible-vlan-tagging;
        unit 0 {
            description vR10->vR1;
            vlan-id 4093;
        }
        unit 206 {
            description "vrr -> vr1";
            vlan-id 206;
            family inet {
                address 172.20.0.65/31;
            }
            family iso;
        }
    }
    ge-0/0/9 {
        flexible-vlan-tagging;
        unit 0 {
            description vR10->vR2;
            vlan-id 4093;
        }
        unit 207 {
            description "vrr -> vr2";
            vlan-id 207;
            family inet {
                address 172.20.0.67/31;
            }
            family iso;
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 172.16.0.10/32;
            }
            family iso {
                address 49.0001.0000.0000.0010.00;
            }
        }
    }
}
policy-options {
    route-filter-list bgp-default-announce-ipv4 {
        172.16.0.10/32 exact;
    }
    policy-statement bgp-default-redistribute {
        term advertise-ipv4 {
            from {
                route-filter-list bgp-default-announce-ipv4;
            }
            then next policy;
        }
        term redis_bgp {
            from protocol bgp;
            then next policy;
        }
        term default {
            then reject;
        }
    }
    policy-statement bgp-final {
        term final-option {
            then accept;
        }
    }
    policy-statement bgp-initial {
        term initial-cleanup {
            then next policy;
        }
    }
    policy-statement next-hop-all-ipv4 {
        term next-hop-self-ipv4 {
            from family inet;
            then {
                next-hop self;
            }
        }
    }
    policy-statement next-hop-all-ipv6 {
        term next-hop-self-ipv6 {
            from family inet6;
            then {
                next-hop self;
            }
        }
    }
    policy-statement next-hop-ebgp-ipv4 {
        term next-hop-self-ipv4 {
            from {
                family inet;
                route-type external;
            }
            then {
                next-hop self;
            }
        }
    }
    policy-statement next-hop-ebgp-ipv6 {
        term next-hop-self-ipv6 {
            from {
                family inet6;
                route-type external;
            }
            then {
                next-hop self;
            }
        }
    }
}
routing-instances {
    mgmt_junos {
        routing-options {
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
        description management-instance;
    }
}
routing-options {
    router-id 172.16.0.10;
    autonomous-system 65000;
}
protocols {
    bgp {
        group ibgp-peers-ipv4 {
            type internal;
            advertise-inactive;
            export [ next-hop-ebgp-ipv4 bgp-default-redistribute bgp-final ];
            cluster 172.16.0.10;
            neighbor 172.16.0.1 {
                description vr1;
                local-address 172.16.0.10;
                family inet {
                    unicast;
                }
                authentication-algorithm ao;
                authentication-key-chain jncie;
            }
            neighbor 172.16.0.2 {
                description vr2;
                local-address 172.16.0.10;
                family inet {
                    unicast;
                }
            }
        }
        group ebgp-peers {
            advertise-inactive;
            export [ bgp-default-redistribute bgp-final ];
        }
    }
    isis {
        interface ge-0/0/8.206 {
            point-to-point;
        }
        interface ge-0/0/9.207 {
            point-to-point;
        }
        interface lo0.0;
        level 1 {
            disable;
            wide-metrics-only;
        }
        level 2 wide-metrics-only;
    }
    lldp {
        interface fxp0 {
            disable;
        }
        interface all;
    }
}
