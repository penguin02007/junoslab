## Junos Lab ##
version 23.2R2.21;
system {
    host-name vr2;
    root-authentication {
        encrypted-password "$6$tpEPzERB$fCS9Ay8VESZR9Wsk9J.T0LbchXtWuUrzSLIT.sUfUCahRrUu/bDxFmSGVTmrT.6KnwHbwGk8WH/Q3dIgUEvVx1";
    }
    login {
        user admin {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$G9LlS8OM$cg3LKcaz/U.X28qM6bElCiEzsSCd.CMJm4ZIeXb4f2.VVgFkTQOgbLRDWW4PM9lan64pHOChz1Y.EmmNZfL3I1";
            }
        }
    }
    services {
        ssh;
        extension-service {
            request-response {
                grpc {
                    clear-text {
                        port 57400;
                    }
                    max-connections 4;
                }
            }
        }
        netconf {
            ssh;
            rfc-compliant;
        }
    }
    management-instance;
    static-host-mapping {
        vrr inet 172.16.0.10;
        vr1 inet 172.16.0.1;
    }
    syslog {
        file interactive-commands {
            interactive-commands any;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
}
chassis {
    fpc 0 {
        pic 0 {
            number-of-ports 96;
        }
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            description vR2->vR1;
            family inet {
                address 172.20.0.1/31;
            }
            family iso;
        }
    }
    ge-0/0/9 {
        flexible-vlan-tagging;
        unit 0 {
            description vR2->vR10;
            vlan-id 4093;
        }
        unit 207 {
            description "vr2 -> vrr";
            vlan-id 207;
            family inet {
                address 172.20.0.66/31;
            }
            family iso;
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 10.0.0.15/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 172.16.0.2/32;
            }
            family iso {
                address 49.0001.0000.0000.0002.00;
            }
        }
    }
}
policy-options {
    route-filter-list bgp-default-announce-ipv4 {
        172.16.0.2/32 exact;
    }
    policy-statement bgp-default-redistribute {
        term advertise-ipv4 {
            from {
                route-filter-list bgp-default-announce-ipv4;
            }
            then next policy;
        }
        term redis_bgp {
            from protocol bgp;
            then next policy;
        }
        term default {
            then reject;
        }
    }
    policy-statement bgp-final {
        term final-option {
            then accept;
        }
    }
    policy-statement bgp-initial {
        term initial-cleanup {
            then next policy;
        }
    }
    policy-statement next-hop-all-ipv4 {
        term next-hop-self-ipv4 {
            from family inet;
            then {
                next-hop self;
            }
        }
    }
    policy-statement next-hop-all-ipv6 {
        term next-hop-self-ipv6 {
            from family inet6;
            then {
                next-hop self;
            }
        }
    }
    policy-statement next-hop-ebgp-ipv4 {
        term next-hop-self-ipv4 {
            from {
                family inet;
                route-type external;
            }
            then {
                next-hop self;
            }
        }
    }
    policy-statement next-hop-ebgp-ipv6 {
        term next-hop-self-ipv6 {
            from {
                family inet6;
                route-type external;
            }
            then {
                next-hop self;
            }
        }
    }
}
routing-instances {
    mgmt_junos {
        routing-options {
            static {
                route 0.0.0.0/0 next-hop 10.0.0.2;
            }
        }
        description management-instance;
    }
}
routing-options {
    router-id 172.16.0.2;
    autonomous-system 65000;
}
protocols {
    bgp {
        group ibgp-peers-ipv4 {
            type internal;
            advertise-inactive;
            export [ next-hop-ebgp-ipv4 bgp-default-redistribute bgp-final ];
            neighbor 172.16.0.10 {
                description vrr;
                local-address 172.16.0.2;
                family inet {
                    unicast;
                }
            }
        }
        group ebgp-peers {
            advertise-inactive;
            export [ bgp-default-redistribute bgp-final ];
        }
    }
    isis {
        interface ge-0/0/0.0 {
            point-to-point;
        }
        interface ge-0/0/9.207 {
            point-to-point;
        }
        interface lo0.0;
        level 1 {
            disable;
            wide-metrics-only;
        }
        level 2 wide-metrics-only;
    }
    lldp {
        interface fxp0 {
            disable;
        }
        interface all;
    }
}
